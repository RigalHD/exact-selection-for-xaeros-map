plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'com.diffplug.spotless' version '8.8.0'
}
version = '1.3.3+1.21.11'
group = 'dev.exactselection'
repositories {
    mavenCentral()
    maven { url = 'https://chocolateminecraft.com/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}
dependencies {
    minecraft 'com.mojang:minecraft:1.21.11'
    mappings loom.officialMojangMappings()
    modImplementation 'net.fabricmc:fabric-loader:0.19.5'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.6+1.21.11'
    modCompileOnly 'com.terraformersmc:modmenu:17.0.1'
    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('xaeroDeps')) {
        modImplementation fileTree(dir: project.property('xaeroDeps'), include: '*.jar')
    } else {
        modImplementation 'xaero.map:xaeroworldmap-fabric-1.21.11:1.41.0'
        modImplementation 'xaero.minimap:xaerominimap-fabric-1.21.11:26.1.0'
        modImplementation 'xaero.lib:xaerolib-fabric-1.21.11:1.1.15'
    }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    // Class files of libraries name annotations the build does not have; everything else must stay clean.
    options.compilerArgs.addAll(['-Xlint:all,-classfile', '-Werror'])
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
// One code style for the whole project; `./gradlew spotlessApply` formats, and `check` fails on unformatted code.
spotless {
    java {
        target 'src/*/java/**/*.java', 'tools/*.java', 'gametest/*.java'
        palantirJavaFormat('2.101.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.named('test') {
    useJUnitPlatform()
    // Each class builds its own fake Minecraft in static fields, as each check did in its own JVM.
    forkEvery = 1
    testLogging { events 'passed', 'skipped', 'failed' }
}
