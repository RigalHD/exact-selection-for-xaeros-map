name: Bug report / Ошибка
description: Something does not work as described / Что-то работает не так, как описано
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. You can write in English or in Russian.
        Спасибо за сообщение. Можно писать по-английски или по-русски.
  - type: textarea
    id: what
    attributes:
      label: What happened / Что произошло
      description: What you did, what you expected and what happened instead. / Что вы сделали, чего ожидали и что получилось.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce / Как повторить
      placeholder: |
        1. Open the world map and turn the tool on
        2. ...
  - type: input
    id: mod
    attributes:
      label: Mod version / Версия мода
      placeholder: 1.4.0+1.21.11
    validations:
      required: true
  - type: input
    id: xaero
    attributes:
      label: Xaero's World Map and Minimap versions / Версии World Map и Minimap
      placeholder: World Map 1.47.2, Minimap 26.6.2 (or "no Minimap")
    validations:
      required: true
  - type: input
    id: fabric
    attributes:
      label: Fabric Loader and Fabric API versions / Версии Fabric Loader и Fabric API
      placeholder: Loader 0.19.5, API 0.141.6+1.21.11
  - type: textarea
    id: mods
    attributes:
      label: Other mods / Другие моды
      description: Especially ones that change the map, the GUI or rendering. / Особенно те, что меняют карту, интерфейс или отрисовку.
  - type: textarea
    id: log
    attributes:
      label: Log / Журнал
      description: For a crash or a frozen tool, attach `logs/latest.log` or paste the error. / При падении или зависании приложите `logs/latest.log` или вставьте ошибку.
      render: text
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Скриншоты
      description: Drag images here if something looks wrong. / Перетащите сюда картинки, если что-то выглядит неправильно.
