plugins {
    id 'net.fabricmc.fabric-loom-remap' version '1.17.20'
    id 'com.diffplug.spotless' version '8.8.0'
}
version = project.mod_version
group = 'dev.exactselection'
repositories {
    mavenCentral()
    maven { url = 'https://chocolateminecraft.com/maven' }
    maven { url = 'https://maven.terraformersmc.com/releases' }
}
dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
    testImplementation platform("org.junit:junit-bom:${project.junit_version}")
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    if (project.hasProperty('xaeroDeps')) {
        modImplementation fileTree(dir: project.property('xaeroDeps'), include: '*.jar')
    } else {
        modImplementation "xaero.map:xaeroworldmap-fabric-${project.minecraft_version}:${project.xaero_worldmap_version}"
        modImplementation "xaero.minimap:xaerominimap-fabric-${project.minecraft_version}:${project.xaero_minimap_version}"
        modImplementation "xaero.lib:xaerolib-fabric-${project.minecraft_version}:${project.xaero_lib_version}"
    }
}
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
    // Class files of libraries name annotations the build does not have; everything else must stay clean.
    options.compilerArgs.addAll(['-Xlint:all,-classfile', '-Werror'])
}
processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
jar {
    from('LICENSE')
}
// One code style for the whole project; `./gradlew spotlessApply` formats, and `check` fails on unformatted code.
spotless {
    java {
        target 'src/*/java/**/*.java', 'tools/*.java', 'gametest/*.java'
        palantirJavaFormat('2.101.0')
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}
tasks.named('test') {
    useJUnitPlatform()
    // Each class builds its own fake Minecraft in static fields, as each check did in its own JVM.
    forkEvery = 1
    testLogging { events 'passed', 'skipped', 'failed' }
}
